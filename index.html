<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cumberland County Sheriff's Department — Search & Rescue (TACNET)</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --tactical-od: #4B5320;
            --tactical-dark-od: #2B3111;
            --tactical-gold: #D4AF37;
            --tactical-light-gold: #F3E5AB;
            --bg-dark: #161A0D;
            --text-light: #E0E0E0;
            --alert-red: #D32F2F;
            --neon-green: #00FF66;
            --unit-blue: #1E88E5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header {
            background-color: var(--tactical-dark-od);
            border-bottom: 2px solid var(--tactical-gold);
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1200;
        }
        .header-title h1 { color: var(--tactical-gold); font-size: 0.9rem; text-transform: uppercase; }
        .header-title p { font-size: 0.65rem; color: var(--text-light); opacity: 0.85; }

        .operator-badge {
            background-color: var(--tactical-od);
            border: 1px solid var(--tactical-gold);
            color: var(--tactical-gold);
            padding: 4px 8px;
            font-size: 0.65rem;
            font-weight: bold;
            border-radius: 3px;
            text-align: right;
        }
        .operator-badge span { display: block; font-size: 0.55rem; color: var(--tactical-light-gold); font-weight: normal; }

        .main-container { display: flex; flex: 1; position: relative; width: 100vw; height: calc(100vh - 50px); }
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #111; z-index: 1; }

        /* Floating Command Toggle */
        .floating-nav { position: absolute; top: 10px; left: 10px; z-index: 1100; }
        .float-btn {
            background-color: var(--tactical-dark-od);
            border: 2px solid var(--tactical-gold);
            color: var(--tactical-gold);
            padding: 8px 14px;
            font-weight: bold;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Top Unit Dock */
        .top-unit-dock {
            position: absolute;
            top: 10px; left: 130px; right: 15px; z-index: 1100;
            background: rgba(43, 49, 17, 0.95);
            border: 2px solid var(--tactical-gold);
            padding: 6px 10px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .dock-header { display: flex; justify-content: space-between; font-size: 0.65rem; color: var(--tactical-gold); font-weight: bold; border-bottom: 1px solid rgba(212,175,55,0.4); padding-bottom: 2px; }
        .dock-unit-grid { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0; }
        .unit-badge-btn {
            min-width: 32px; height: 32px;
            background-color: var(--unit-blue); color: #fff;
            border: 2px solid #fff; border-radius: 50%;
            font-weight: bold; font-size: 0.75rem;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; flex-shrink: 0;
        }
        .unit-badge-btn.active-unit { background-color: var(--neon-green); color: var(--bg-dark); border-color: var(--tactical-gold); }

        /* Sliding Sidebar */
        sidebar {
            position: absolute; top: 0; left: -320px; width: 300px; height: 100%;
            background-color: var(--tactical-dark-od);
            border-right: 2px solid var(--tactical-gold);
            display: flex; flex-direction: column; padding: 12px;
            z-index: 1150; overflow-y: auto; transition: left 0.3s ease-in-out;
        }
        sidebar.open { left: 0; }
        .panel-section { margin-bottom: 12px; }
        .panel-section h2 { color: var(--tactical-gold); font-size: 0.75rem; text-transform: uppercase; border-bottom: 1px solid var(--tactical-gold); padding-bottom: 3px; margin-bottom: 6px; }

        .tactical-btn {
            background-color: var(--tactical-od); color: var(--tactical-gold);
            border: 1px solid var(--tactical-gold); padding: 8px; width: 100%;
            font-weight: bold; font-size: 0.75rem; text-transform: uppercase; border-radius: 3px; cursor: pointer; margin-bottom: 6px;
        }

        /* Modal Overlays */
        .modal-overlay {
            display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 3000; justify-content: center; align-items: center;
        }
        .modal-content {
            background: var(--tactical-dark-od); border: 2px solid var(--tactical-gold);
            color: var(--text-light); width: 90%; max-width: 400px; padding: 20px; border-radius: 6px;
        }
        .modal-header h2 { color: var(--tactical-gold); font-size: 1rem; text-transform: uppercase; text-align: center; margin-bottom: 4px; }
        .modal-header p { font-size: 0.7rem; color: var(--tactical-light-gold); text-align: center; margin-bottom: 12px; }
        .login-input, .login-select { width: 100%; background: rgba(0,0,0,0.6); border: 1px solid var(--tactical-gold); color: #fff; padding: 8px; font-size: 0.85rem; border-radius: 4px; margin-bottom: 10px; }
        .login-btn {
            background-color: var(--neon-green); color: var(--bg-dark); border: 2px solid var(--tactical-gold);
            padding: 12px; width: 100%; font-weight: bold; font-size: 0.9rem; text-transform: uppercase; border-radius: 4px; cursor: pointer;
        }
        .log-box { list-style: none; font-size: 0.7rem; max-height: 80px; overflow-y: auto; background: rgba(0,0,0,0.3); border: 1px solid var(--tactical-gold); padding: 5px; border-radius: 3px; }
        .log-box li { padding: 3px; border-bottom: 1px dashed rgba(212,175,55,0.3); display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <!-- AUTHENTICATION & LOGIN MODAL -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Cumberland County Sheriff's Dept</h2>
                <p>Search & Rescue Live Command System</p>
            </div>
            <label style="font-size:0.75rem; color:var(--tactical-gold); font-weight:bold;">Officer Name & Rank:</label>
            <input type="text" id="loginOfficerName" class="login-input" value="Earl Wood, Dep. (Ret.)">
            
            <label style="font-size:0.75rem; color:var(--tactical-gold); font-weight:bold;">Select Unit Number:</label>
            <select id="loginUnitSelect" class="login-select">
                <option value="1" selected>Unit 1 - Command</option>
                <option value="2">Unit 2</option>
                <option value="3">Unit 3</option>
                <option value="4">Unit 4</option>
                <option value="5">Unit 5</option>
            </select>
            
            <button type="button" class="login-btn" onclick="executeSystemLogin()">🔑 Authenticate & Go Live</button>
        </div>
    </div>

    <header>
        <div class="header-title">
            <h1>Cumberland County Sheriff's Dept</h1>
            <p>TACNET Search & Rescue Matrix</p>
        </div>
        <div class="operator-badge" id="headerOperatorBadge">
            Earl Wood
            <span>Creator / Dep. Sheriff (Ret.)</span>
        </div>
    </header>

    <div class="main-container">
        <div class="floating-nav">
            <button class="float-btn" onclick="toggleCommandPanel()">☰ Command</button>
        </div>

        <div class="top-unit-dock">
            <div class="dock-header">
                <span>Active Search Units (Tap to Track)</span>
                <span id="activeUnitStatusText" style="color:var(--neon-green);">Ready</span>
            </div>
            <div class="dock-unit-grid" id="unitGridContainer"></div>
        </div>

        <sidebar id="commandPanel">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <h2 style="color:var(--tactical-gold); font-size:0.85rem;">Command Controls</h2>
                <button onclick="toggleCommandPanel()" style="background:none; border:none; color:var(--tactical-gold); font-size:1.2rem; cursor:pointer;">✕</button>
            </div>

            <div class="panel-section">
                <button class="tactical-btn" onclick="panToMyLiveGPS()">🎯 Center on My GPS</button>
                <button class="tactical-btn" onclick="triggerEvidenceCapture()">📷 Log Evidence / Find</button>
                <button class="tactical-btn" style="background-color:#8B0000; color:#fff;" onclick="alert('🚨 OFFICER DOWN EMERGENCY BROADCASTED')">🚨 OFFICER DOWN SOS</button>
            </div>

            <div class="panel-section">
                <h2>Active Telemetry Log</h2>
                <ul class="log-box" id="activeGpsList">
                    <li><span>Cumberland S.O. Command</span> <span style="color:#00FF66;">Online</span></li>
                </ul>
            </div>
        </sidebar>

        <div id="map"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Cumberland County, VA center coordinates
        const cumberlandCoords = [37.5054, -78.2255];
        const map = L.map('map', { zoomControl: true }).setView(cumberlandCoords, 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Incident marker for toddler search in Cumberland County
        const incidentMarker = L.circleMarker([37.5200, -78.2400], {
            radius: 12,
            color: '#D4AF37',
            fillColor: '#FFD700',
            fillOpacity: 0.9
        }).addTo(map).bindPopup("<b>TARGET SEARCH AREA:</b> 2-Yr-Old Missing<br>Cumberland County Sector Alpha").openPopup();

        const unitMarkers = {};
        const activeUnitsMap = {};
        let activeWatchId = null;
        let activeUnitId = 1;

        // Populate unit buttons in top dock
        const unitGridContainer = document.getElementById('unitGridContainer');
        for (let i = 1; i <= 5; i++) {
            const btn = document.createElement('button');
            btn.className = 'unit-badge-btn';
            btn.id = `unitBtn_${i}`;
            btn.innerText = i;
            btn.onclick = () => activateUnitGPS(i);
            unitGridContainer.appendChild(btn);
        }

        function executeSystemLogin() {
            const name = document.getElementById('loginOfficerName').value.trim();
            const unit = document.getElementById('loginUnitSelect').value;
            if (!name) { alert("Please enter officer name."); return; }
            
            document.getElementById('loginModal').style.display = 'none';
            activateUnitGPS(parseInt(unit));
        }

        function toggleCommandPanel() {
            document.getElementById('commandPanel').classList.toggle('open');
        }

        function activateUnitGPS(unitId) {
            activeUnitId = unitId;
            document.querySelectorAll('.unit-badge-btn').forEach(b => b.classList.remove('active-unit'));
            document.getElementById(`unitBtn_${unitId}`).classList.add('active-unit');
            document.getElementById('activeUnitStatusText').innerText = `Unit ${unitId} Tracking Active`;

            if (!navigator.geolocation) {
                alert("Geolocation not supported on this device.");
                return;
            }

            if (activeWatchId !== null) navigator.geolocation.clearWatch(activeWatchId);

            activeWatchId = navigator.geolocation.watchPosition((pos) => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                const latLng = [lat, lng];

                if (unitMarkers[unitId]) map.removeLayer(unitMarkers[unitId]);

                const beacon = L.divIcon({
                    className: 'tactical-beacon',
                    html: `<div style="background-color: #00FF66; width: 16px; height: 16px; border-radius: 50%; border: 2px solid #4B5320; box-shadow: 0 0 12px #00FF66;"></div>`,
                    iconSize: [16, 16],
                    iconAnchor: [8, 8]
                });

                unitMarkers[unitId] = L.marker(latLng, { icon: beacon })
                    .addTo(map)
                    .bindPopup(`<b>Unit ${unitId} Live Position</b><br>Lat: ${lat.toFixed(4)}, Lon: ${lng.toFixed(4)}`);

                map.setView(latLng, 16);
            }, (err) => {
                console.error(err);
                alert("Acquiring GPS fix... ensure location permissions are enabled.");
            }, { enableHighAccuracy: true, timeout: 10000 });
        }

        function panToMyLiveGPS() {
            if (unitMarkers[activeUnitId]) {
                map.setView(unitMarkers[activeUnitId].getLatLng(), 17);
            } else {
                alert("GPS lock establishing...");
            }
        }

        function triggerEvidenceCapture() {
            const desc = prompt("Enter Evidence / Find Description:");
            if (desc) {
                const list = document.getElementById('activeGpsList');
                const li = document.createElement('li');
                li.innerHTML = `<span>Find: ${desc}</span> <span style="color:#D4AF37;">${new Date().toLocaleTimeString()}</span>`;
                list.prepend(li);
                alert(`Evidence logged successfully.`);
            }
        }
    </script>
</body>
</html>
